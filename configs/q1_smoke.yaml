seed: 123
run:
  name: q1_smoke
  output_root: paper_outputs
data:
  manifest_path: data/q1_smoke_manifest.csv
  smoke_rows: 4
stack_building:
  input_format: npy_or_manifest
  slice_axis: 0
  validate_stack_shape: true
splits:
  strategy: group_disjoint
  outer_test_size: 0.5
  inner_val_size: 0.5
focus_measure:
  name: cfm4
  maximize: true
labels:
  surrogate_voters:
    - variance_of_laplacian
    - gradient_squared_energy
    - roberts_focus_measure
  leave_one_out: true
preprocessing_library:
  categories:
    - denoise
    - contrast
    - edge
    - frequency
    - morph
    - color
    - retinex
    - upsample
    - structure
  include_unavailable_in_tables: true
workflows:
  candidates:
    - name: identity
      type: baseline
      steps:
        - name: identity
          enabled: true
          category: structure
          params: {}
    - name: conventional_clahe_unsharp
      type: conventional_baseline
      steps:
        - name: clahe_enhancement
          enabled: true
          category: contrast
          params:
            clip_limit: 2.0
            tile_grid_size: 8
        - name: unsharp_mask
          enabled: true
          category: edge
          params:
            sigma: 1.0
            amount: 1.0
            ksize: 3
  single_ops:
    - gaussian_blur
    - median_filter
    - laplacian_sharpen
    - tophat_bothat
optimization:
  generalized:
    optimizer: deterministic_candidate_search
    gp_generations: 2
    population_size: 4
    max_pipeline_length: 3
  dataset_specific:
    optimizer: deterministic_candidate_search
    gp_generations: 2
    population_size: 4
    max_pipeline_length: 3
lodo:
  enabled: true
  heldout_unit: dataset
dataset_specific:
  enabled: true
  use_outer_test_when_available: true
aggregation:
  alpha: 0.7
  dataset_weighting: equal_dataset
  metric_weights:
    absolute_peak_localization_error: 0.20
    range_around_global_maximum: 0.15
    false_maxima_count: 0.10
    fwhm: 0.10
    noise_level: 0.10
    steep_to_gradual_slope_ratio: 0.10
    execution_time_per_slice: 0.10
    steep_slope_width: 0.05
    curvature_at_peak: 0.05
    rrmse_under_additive_noise: 0.05
  alpha_sensitivity: [0.5, 0.7, 0.9]
  metric_weight_schemes:
    default:
      absolute_peak_localization_error: 0.20
      range_around_global_maximum: 0.15
      false_maxima_count: 0.10
      fwhm: 0.10
      noise_level: 0.10
      steep_to_gradual_slope_ratio: 0.10
      execution_time_per_slice: 0.10
      steep_slope_width: 0.05
      curvature_at_peak: 0.05
      rrmse_under_additive_noise: 0.05
    localization_heavy:
      absolute_peak_localization_error: 0.35
      range_around_global_maximum: 0.10
      false_maxima_count: 0.10
      fwhm: 0.10
      noise_level: 0.05
      steep_to_gradual_slope_ratio: 0.10
      execution_time_per_slice: 0.10
      steep_slope_width: 0.05
      curvature_at_peak: 0.03
      rrmse_under_additive_noise: 0.02
statistics:
  bootstrap_resamples: 50
  confidence_level: 0.95
  noise_std: 0.01
  noise_seed: 123
  compute_rrmse: true
outputs:
  root: paper_outputs
  export_figures: true
  export_tables: true
  progress_interval_stack_methods: 2
  stage03_chunk_stack_count: 1
  stage04_chunk_stack_count: 1
runtime_metadata:
  hardware_notes: smoke-test local WSL run
  cpu: auto
  gpu: optional
